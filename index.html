<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Quadro Verde</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="board"></canvas>
  <div id="actions">
    <button id="share" type="button">Compartilhar</button>
    <button id="clear" type="button">Limpar</button>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="link-prompt" role="alertdialog" aria-labelledby="link-prompt-text" hidden>
    <p id="link-prompt-text">Este link contém outro quadro, diferente do que está neste aparelho.</p>
    <div class="prompt-buttons">
      <button id="link-open" type="button">Abrir quadro do link</button>
      <button id="link-keep" type="button">Manter o meu</button>
    </div>
  </div>
  <div id="tools" role="toolbar" aria-label="Ferramentas" aria-orientation="vertical">
    <button id="tool-chalk" type="button" aria-label="Giz (escrever)" aria-pressed="true" title="Giz (B ou G)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(45 12 12)"><rect x="9.5" y="1.5" width="5" height="15" rx="1.2"/><path d="M9.5 6h5"/><path d="M10.5 16.5l1.5 3.5 1.5-3.5" fill="currentColor"/></g><path d="M2.5 22c2.5-1.5 4 1 6.5-.5"/></svg>
    </button>
    <button id="tool-hand" type="button" aria-label="Mão (mover o quadro)" aria-pressed="false" title="Mão (H, ou espaço + arrastar)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-1V3.5a1.5 1.5 0 0 1 3 0V11m0-5.5a1.5 1.5 0 0 1 3 0V12m0-3.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1.5a7 7 0 0 1-5.6-2.8L4 15.5a1.6 1.6 0 0 1 2.5-2L8 15"/></svg>
    </button>
    <button id="tool-eraser" type="button" aria-label="Apagador" aria-pressed="false" title="Apagador (E)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="11" rx="2.5"/><path d="M3 13h18v1.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 14.5z" fill="currentColor"/><path d="M5 21h14"/></svg>
    </button>
  </div>
  <div id="eraser-cursor" hidden></div>
  <div id="controls" role="group" aria-label="Zoom">
    <button id="zoom-out" type="button" aria-label="Diminuir zoom" title="Diminuir zoom">&minus;</button>
    <button id="zoom-reset" type="button" aria-label="Zoom 100%" title="Zoom 100%">100%</button>
    <button id="zoom-in" type="button" aria-label="Aumentar zoom" title="Aumentar zoom">+</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
